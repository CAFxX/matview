name: CI — Multi-Engine Materialized View Tests

# Matrix policy — keep this block, ci-deferred.yml and ci-extended.yml in sync.
#
# PR-gate selection criteria:
# - Every row must exercise a distinct engine implementation, a materially
#   different supported major-version boundary, or a declared runtime boundary.
# - Keep the oldest supported stable line and the newest stable/LTS line where
#   their behavior can differ. Keep one representative for each genuinely
#   distinct engine family; do not build a Cartesian product of every engine,
#   engine version, Python version, driver version, and distribution.
# - Run the full deterministic suite and the fixed-seed fuzz campaign for every
#   PR-gate row. The stable CI success job aggregates only these required jobs.
#
# PR-gate dimensions:
# - Python: CPython 3.11 (oldest supported) and 3.15 (newest released) on the
#   standard SQLite path; Python 3.12 is used for every live-engine job. Python
#   3.13–3.14 are exercised in ci-deferred.yml.
# - SQLite: CPython's bundled sqlite3 plus one current representative of APSW,
#   SQLCipher, and libSQL. The alternative drivers run on Python 3.12, not across
#   every Python version.
# - PostgreSQL: native upstream 15 (oldest supported major) and 18 (newest).
#   PostgreSQL 16–17 and one Percona PostgreSQL 18 build are deferred (nightly).
#   PostgreSQL 14 is removed: upstream support ends 2026-11-12.
# - MySQL: upstream 8.4 and 9.7 LTS lines are both required. Innovation 26.10
#   and Percona Server 8.4/9.7 are deferred (nightly).
# - MariaDB: 10.11 (oldest selected LTS), 11.8, and 12.3 (newest LTS) are
#   required. LTS 11.4 and the current rolling release are deferred (nightly).
#   The rolling row is 13.0 (13.0.2 GA) because 13.1 has no stable Docker tag
#   yet (only 13.1-rc); move it to 13.1 when 13.1 is GA. 13.0's community
#   maintenance ends Q4 2026, so it is not a long-term support claim.
# - Vendor/extension images: Percona distributions are deferred as representative
#   vendor-build checks, not repeated for every upstream major. TimescaleDB,
#   PostGIS, and pgvector images are excluded from CI until tests actually create
#   and exercise their extensions; image startup alone is not extension coverage.
# - Fuzzing: every full-suite job runs a fixed-seed differential fuzz campaign
#   (the workflow-level MATVIEW_FUZZ_* env below): seeds 20261106 and 1337,
#   scenarios 1-2, 70 views and 60 mutations per scenario, no random seeds.
#   Views/mutations are pinned to the scale-2 sizes so each gate (seed,
#   scenario) is identical to the one the former scale-2 gate campaign ran;
#   every deterministic fuzz catch in CI history came from seed 20261106
#   scenario 1. The gate's fuzz campaign is therefore deterministic: a fuzz
#   failure reproduces from the tested revision, not from a fresh random seed
#   (concurrency flakes are a separate problem). The permanent
#   fuzz regression corpus (Suite 13) and all deterministic suites are
#   unchanged.
# - Random-seed fuzzing moved to ci-extended.yml (not a required check; push to
#   master, nightly, on demand): the scale-2 campaign (4 fixed seeds incl.
#   424242 and 992138513, scenario 3, plus 4 random seeds) on SQLite, PostgreSQL
#   18, MySQL 8.4 and MariaDB 12.3. A failure there uploads the failing seeds
#   with a replay command and opens or updates one GitHub issue; each confirmed
#   failure is added to the Suite 13 corpus in its fix PR. Scale-3 stress
#   campaigns stay in ci-deferred.yml (weekly schedule).
#
# Dependency and environment dimensions:
# - requirements.txt declares packaging>=23.0, sqlglot>=30.24.0, jinja2>=3.1.0,
#   sqlalchemy>=2.0.0, psycopg2-binary>=2.9.9 and cryptography>=41.0.0 for Python
#   <3.15, pymysql>=1.1.0, hypothesis>=6.100, and pytest>=8.0. PR jobs resolve the
#   newest compatible releases; ci-deferred.yml derives exact pins from these
#   floors and tests them nightly on Python 3.11 against live PostgreSQL and MySQL.
#   sqlglot 30.23 and older fail (30.23 emits VAR_POP as the non-existent MySQL
#   function VARIANCE_POP and parses MySQL VARIANCE as the sample variance; before
#   30.23 no TokenType.NATIONAL_RAW_STRING; before 25.2 no exp.SetOperation). requirements-dev.txt (PyYAML, pyright) is installed
#   only by the SQLite jobs: PyYAML for scripts/test_presubmit.py, pyright for the
#   static type check, which runs once (the oldest-Python SQLite cell) against
#   pythonVersion 3.11 in pyrightconfig.json and fails the required gate.
# - Timeouts: 25 minutes per gate job (the slowest gate job measured 11 min
#   after the fixed-seed gate, 30-34 min before it), 5 for bookkeeping jobs.
# - Optional SQLite drivers (apsw, apsw-sqlite3mc, sqlcipher3-binary,
#   sqlean.py, libsql-experimental) have no declared lower bounds. CI therefore
#   tests the newest installable release only; it makes no oldest-driver-version
#   compatibility claim. Define a minimum before adding such a version lane.
# - Docker tags select a server major/LTS/rolling line and therefore its current
#   patch release; patch versions are not a separate matrix dimension. No silent
#   image fallback is allowed: a missing requested tag must fail the job.
# - Runner/OS is ubuntu-latest (GitHub-hosted x64); Windows, macOS, other Linux
#   distributions, and other architectures are not currently CI support claims.
#   Action versions are pinned by major (checkout v4, setup-python v5), not
#   cross-producted. Review action upgrades separately.
#
# Deferred coverage is implemented in ci-deferred.yml (nightly; the six scale-3
# fuzz campaigns weekly; a failing scheduled run opens or updates one issue):
# Python 3.13–3.14; PostgreSQL 16–17 and Percona PostgreSQL 18; MySQL 26.10
# Innovation; MariaDB 11.4 and 13.0 rolling; Percona MySQL 8.4 and 9.7;
# SQLite3MC and sqlean (sqlean's own VAR_*/STDDEV_* views are refused: see
# ci-deferred.yml); minimum declared Python
# dependency versions. Extensions without feature tests are excluded, not
# deferred.
#
# Extended exploration (ci-extended.yml, not a merge gate): random-seed scale-2
# fuzz on SQLite (Python 3.12), PostgreSQL 18, MySQL 8.4 and MariaDB 12.3.
#
# Emulated backends run in the SQLite jobs, not once per engine: the SQLite
# jobs (Python 3.11 and 3.15) run every test_matview_sync.py batch, including
# the in-memory SQLite and the transpiled PostgreSQL/MySQL executions. The
# live-engine jobs (sqlite-compat, postgres, mysql, mysql-compat) set
# MATVIEW_EMULATED_BACKENDS=skip, so Suites 1-13 run only the batches whose
# dialect executes natively on their server (the unittest classes ignore it);
# the skipped batches are engine-independent emulation, not native coverage.
# The PR gate therefore no longer runs them on Python 3.12, which is not a
# declared stdlib-SQLite gate dimension; ci-deferred.yml's live jobs (3.12,
# no skip) still run them nightly.
#
# In-job parallelism (owner budget: every job within 15 minutes): the sqlite
# and postgres jobs run test_matview_sync.py as shards (--suites, Suite 12
# split by --seed-shard; test_p2_ci_matrix_verification.py checks that the
# shards run every suite exactly once), the postgres job together with its
# test modules, through scripts/ci_parallel.py. Each task gets its own database
# on the job's server (created and dropped by the runner; the step DSN names
# only the server), its own TMPDIR and its own fuzz manifest. Modules that use
# threads, lock waits, server-wide caches or timing assertions run --serial,
# alone, after the parallel phase. The runner never retries a task; it retries
# only its own database create/drop on transient errors. The mysql and
# mysql-compat jobs stay serial until their server memory is bounded: one
# full-suite fuzz batch spikes MySQL/MariaDB memory by ~4 GB and the server's
# RSS ratchets up across batches (measured: MariaDB 11.8 is OOM-killed at a
# 7 GiB cap even with one full-suite shard at a time).

# A new push to a pull request supersedes (cancels) that PR's older run; the
# group is keyed on the PR number. Every other event (push to master,
# merge_group, workflow_dispatch) gets a group of its own (keyed on the run
# id), so trunk runs are never cancelled or replaced by a later trunk push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    # Trunk pushes only. Stacked-PR layers get exact-head CI from the
    # pull_request event (it has no branch filter, so it runs for PRs whose
    # base is another stack branch). A push trigger on stack branches would
    # start a second run in the same concurrency group on every push; one of
    # the two is cancelled and its `CI success` aggregator records a failed
    # check on the head commit, which leaves the PR BLOCKED.
    branches: ["main", "master"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Stream test output so per-suite progress and timing are visible live.
  PYTHONUNBUFFERED: "1"
  # Fixed-seed PR-gate fuzz campaign (see the matrix policy above). Do not
  # override these per job: test_p2_ci_matrix_verification.py checks that the
  # gate campaign stays a subset of the scale-2 fixed-seed campaign.
  MATVIEW_FUZZ_SCALE: "1"
  MATVIEW_FUZZ_RANDOM_SEEDS: "0"
  MATVIEW_FUZZ_VIEWS_PER_SCHEMA: "70"
  MATVIEW_FUZZ_MUTATIONS: "60"

jobs:
  # Only an explicitly whitelisted documentation-only PR may skip the matrix.
  # Other events (including merge_group) always run the full required CI gate.
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - name: Classify pull request paths
        id: paths
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("docs_only", "false");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              }
            );

            // Keep this whitelist conservative: source, tests, workflows,
            // dependency/build configuration, generated artifacts, and
            // executable examples all force the normal matrix. README.md is
            // not whitelisted: its examples are executed by
            // test_readme_examples.py.
            const documentationPaths = [
              /^AGENTS\.md$/i,
              /^TODO\.md$/i,
              /^CHANGELOG(?:\.(?:md|mdx|rst|txt))?$/i,
              /^CONTRIBUTING(?:\.(?:md|mdx|rst|txt))?$/i,
              /^CODE_OF_CONDUCT\.md$/i,
              /^SECURITY\.md$/i,
              /^LICENSE(?:\.(?:md|rst|txt))?$/i,
              /^docs\/.*\.(?:md|mdx|rst|txt|png|jpe?g|gif|webp|svg|pdf|ico)$/i,
              /^\.github\/.*\.md$/i,
            ];

            const docsOnly =
              files.length > 0 &&
              files.length < 3000 &&
              files.every(file =>
                documentationPaths.some(pattern => pattern.test(file.filename))
              );

            core.setOutput("docs_only", docsOnly ? "true" : "false");
            core.info(`Classified ${files.length} changed path(s): docs_only=${docsOnly}`);

  docs-only:
    name: Documentation-only fast path
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept the whitelisted documentation-only change
        run: echo "Only explicitly whitelisted documentation paths changed."

  # Standard-library SQLite at the oldest and newest supported CPython ends.
  sqlite:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    name: SQLite 3 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          # PyYAML: the presubmit self-test step parses this workflow file.
          # The type checker (requirements-dev.txt) is used by the static type check step below.
          python3 -m pip install -r requirements-dev.txt

      - name: Verify SQLite library version
        run: python3 -c "import sqlite3; print('SQLite version:', sqlite3.sqlite_version)"

      # Runs once, in the oldest-Python cell: the check targets pythonVersion
      # 3.11 (pyrightconfig.json) whichever interpreter runs it, so repeating it
      # in the 3.15 cell would only duplicate the result. Keep this literal equal
      # to the oldest matrix entry (test_p1_static_typing_gate.py checks it).
      - name: Static type check (pyright)
        if: matrix.python-version == '3.11'
        run: pyright

      - name: Verify SQLite runtime feature boundaries
        run: python3 test_sqlite_runtime_boundaries.py

      - name: Run full test suite (SQLite + cross-dialect transpiled suites) in parallel shards
        env:
          MATVIEW_FUZZ_TARGET: "SQLite / Python ${{ matrix.python-version }}"
        run: |
          python3 scripts/ci_parallel.py --jobs 4 \
            --task "python3 test_matview_sync.py --suites 12 --seed-shard 0/2" \
            --task "python3 test_matview_sync.py --suites 12 --seed-shard 1/2" \
            --task "python3 test_matview_sync.py --suites 1" \
            --task "python3 test_matview_sync.py --suites 2-8" \
            --task "python3 test_matview_sync.py --suites 9-11,13,unit"
      - name: Verify curated mutation sensitivity
        run: python3 mutation_testing.py
      - name: Archive fuzz campaign manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-campaign-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: fuzz-campaign*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Test independent-session backfill concurrency
        run: python3 test_concurrent_backfill.py

      - name: Test PostgreSQL result-type plan guards (offline)
        run: python3 test_native_result_types.py

      - name: Test VAR/STDDEV result representation plan guards (offline)
        run: python3 test_native_statistical_aggregates.py

      - name: Test AVG maintenance exactness and concurrency contract
        run: python3 test_avg_concurrent_maintenance.py

      - name: Differentially test native bulk statements (SQLite)
        run: pytest -v -rxXs test_native_bulk_statements.py

      - name: Differentially test the DML and trigger interaction matrix (SQLite)
        run: pytest -v -rxXs test_native_dml_interactions.py

      - name: Test differential-oracle mutation sensitivity
        run: python3 test_oracle_mutation_sensitivity.py

      - name: Test SQLite writer-connection initializer (REPLACE maintenance)
        run: python3 test_sqlite_writer_connections.py

      - name: Test atomic MV replacement (SQLite)
        run: python3 test_registration_replacement.py

      - name: Test lifecycle transaction ownership (SQLite)
        run: python3 test_registration_lifecycle.py

      - name: Test fail-closed bulk_changes transaction ownership (SQLite)
        run: python3 test_bulk_changes_safety.py

      - name: Test recursive SELECT AST generator
        run: python3 test_query_ast_fuzzer.py

      - name: Differentially test generated SELECT materialized views
        run: python3 test_query_ast_materialization.py

      - name: Test schema graph counterexample shrinking
        run: python3 -m unittest -v test_schema_graph_minimizer

      - name: Report test strength and honest coverage statistics
        run: python3 test_strength_reporting.py

      - name: Test differential oracle adversarial boundaries
        run: python3 test_oracle_adversarial_boundaries.py

      - name: Test STRICT-aware SQLite diagnostics, introspection and drift (skips below SQLite 3.37)
        run: python3 test_sqlite_strict_diagnostics.py

      - name: Test exact SQLite SUM/TOTAL/AVG maintenance (no tolerance)
        run: python3 test_sqlite_exact_float_aggregates.py

      - name: Differentially test STRICT SQLite source tables (skips below SQLite 3.37)
        run: python3 test_sqlite_strict_sources.py

      - name: Test group keys follow the column collation (SQLite NOCASE/RTRIM/BINARY)
        run: python3 test_group_key_collation.py

      - name: Test PostgreSQL/MySQL order-sensitive aggregate SQL-shape guards (offline)
        run: python3 test_pgmy_exact_float_aggregates.py

      - name: Test MIN/MAX (group, arg) index recommendation (SQLite + offline)
        run: python3 test_minmax_group_arg_index.py

      - name: Test exact routing of aggregates without an algebraic rule (SQLite + offline)
        run: python3 test_unrecognized_aggregates.py

      - name: Test catalog classification of user-defined functions (SQLite)
        run: python3 test_native_function_classification.py

      - name: Test bulk_changes atomic shadow swap and trigger isolation
        run: python3 test_p0_bulk_changes_isolation.py

      - name: Test PK swap data loss prevention and MySQL collation safety
        run: python3 test_p0_pk_swap_and_collation.py

      - name: Test backfill watermark safety and trigger coverage
        run: python3 test_p0_backfill_watermark_safety.py

      - name: Test compiler alias, aux type, and PK NULL safety
        run: python3 test_p0_compiler_alias_aux_pk_safety.py

      - name: Test dialect-aware SQLGlot AST parsing
        run: python3 test_p1_dialect_parsing.py

      - name: Verify Docker test environment and configuration
        run: python3 test_docker_test_env.py

      - name: Execute README examples and check its links and CI matrix
        run: python3 test_readme_examples.py

      - name: Test matview diff CLI command & compilation plan diagnostics
        run: python3 test_cli_diff.py

      - name: Test standardized engine version parsing with packaging
        run: python3 test_p1_packaging_version.py

      - name: Test manager cursor leak and rollback safety
        run: python3 test_p1_manager_safety.py

      - name: Test engine and version-specific optimal codegen
        run: python3 test_p1_engine_codegen.py

      - name: Test stateful property-based fuzzing and shrinking (Hypothesis + pytest)
        run: pytest -v test_p1_hypothesis_stateful.py

      - name: Test quoting SQL reserved keyword identifiers across DDL and triggers
        run: python3 test_p1_quote_identifiers.py

      - name: Test PostgreSQL statement transition-table vectorization
        run: python3 test_p1_pg_transition_vectorization.py

      - name: Test dialect-aware AST expression storage type inference
        run: python3 test_p1_expr_storage_types.py

      - name: Test sqlglot.exp AST SQL builder helpers
        run: python3 test_p1_sqlglot_builders.py

      - name: Test Jinja2 procedural trigger and backfill templates
        run: python3 test_p1_jinja2_templates.py

      - name: Test SQLAlchemy unified connectivity and schema introspection
        run: python3 test_p1_sqlalchemy_integration.py

      - name: Test modular matview package and immutable IR compilation
        run: python3 test_p1_modular_package.py

      - name: Verify CI matrix definitions and engine verification
        run: python3 test_p2_ci_matrix_verification.py

      - name: Test the local presubmit gate derived from this workflow
        run: python3 scripts/test_presubmit.py

      - name: Test the pyright gate configuration, mixin contract, and fault detection
        run: python3 test_p1_static_typing_gate.py

      - name: Test user-declared view indexes (CREATE INDEX and indexes=)
        run: python3 test_p1_user_view_indexes.py

      - name: Test P2 base index introspection, recommendations, and auto-indexes
        run: python3 test_p2_index_intelligence.py

      - name: Test P2 partition-scoped Tier 2 window maintenance
        run: python3 test_p2_window_partition_scoping.py

  # One representative build per distinct SQLite-compatible implementation.
  sqlite-compat:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "APSW SQLite"
            engine: "apsw"
            pip-pkg: "apsw"
            python-version: "3.12"
          - label: "SQLCipher 4"
            engine: "sqlcipher"
            pip-pkg: "sqlcipher3-binary"
            python-version: "3.12"
          - label: "Turso libSQL"
            engine: "libsql"
            pip-pkg: "libsql-experimental"
            python-version: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies and SQLite driver
        env:
          ENGINE: ${{ matrix.engine }}
          PIP_PACKAGE: ${{ matrix.pip-pkg }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          if [ "$ENGINE" = "sqlcipher" ]; then
            sudo apt-get update
            sudo apt-get install -y libsqlcipher-dev sqlcipher
            python3 -m pip install sqlcipher3-binary || python3 -m pip install sqlcipher3
          elif [ "$ENGINE" = "libsql" ]; then
            python3 -m pip install libsql-experimental || python3 -m pip install libsql
          else
            python3 -m pip install "$PIP_PACKAGE"
          fi

      - name: Run full test suite + live ${{ matrix.label }} integration tests
        env:
          SQLITE_COMPAT_ENGINE: ${{ matrix.engine }}
          MATVIEW_FUZZ_TARGET: "${{ matrix.label }} / Python ${{ matrix.python-version }}"
          MATVIEW_EMULATED_BACKENDS: skip
        run: python3 test_matview_sync.py

      - name: Test manager cursor leak and rollback safety
        env:
          SQLITE_COMPAT_ENGINE: ${{ matrix.engine }}
        run: python3 test_p1_manager_safety.py

      - name: Test lifecycle transaction ownership (raw driver connection, e.g. APSW)
        run: python3 test_registration_lifecycle.py
      - name: Archive fuzz campaign manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-campaign-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: fuzz-campaign.json
          if-no-files-found: ignore
          retention-days: 30

  # Oldest and newest supported upstream PostgreSQL major versions.
  postgres:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    name: PostgreSQL ${{ matrix.pg-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg-version: ["15", "18"]
    steps:
      - name: Start PostgreSQL ${{ matrix.pg-version }} with prepared transactions enabled
        env:
          POSTGRES_IMAGE: postgres:${{ matrix.pg-version }}
        run: |
          docker pull "$POSTGRES_IMAGE"
          docker run -d --name postgres-srv \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=matview_test \
            -p 5432:5432 \
            "$POSTGRES_IMAGE" \
            -c max_prepared_transactions=10
          for i in $(seq 1 120); do
            if docker exec postgres-srv pg_isready -h 127.0.0.1 -U postgres -d matview_test; then
              echo "PostgreSQL ${{ matrix.pg-version }} is ready!"
              exit 0
            fi
            sleep 1
          done
          docker logs postgres-srv
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verify actual PostgreSQL server version
        env:
          POSTGRES_DSN: "postgresql://postgres:password@127.0.0.1:5432/matview_test"
          EXPECTED_PG_MAJOR: ${{ matrix.pg-version }}
        run: python3 verify_engine_matrix.py

      - name: Run the full test suite + live PostgreSQL ${{ matrix.pg-version }} modules in parallel (one database per task)
        env:
          POSTGRES_DSN: "postgresql://postgres:password@127.0.0.1:5432/matview_test"
          MATVIEW_FUZZ_TARGET: "PostgreSQL ${{ matrix.pg-version }}"
          MATVIEW_EMULATED_BACKENDS: skip
        run: |
          python3 scripts/ci_parallel.py --jobs 3 \
            --task "python3 test_matview_sync.py --suites 12 --seed-shard 0/2" \
            --task "python3 test_matview_sync.py --suites 12 --seed-shard 1/2" \
            --task "python3 test_matview_sync.py --suites 1" \
            --task "python3 test_matview_sync.py --suites 2-8" \
            --task "python3 test_matview_sync.py --suites 9-11,13,unit" \
            --task "python3 test_native_statistical_aggregates.py" \
            --task "python3 test_p1_manager_safety.py" \
            --task "python3 test_p1_sqlalchemy_integration.py" \
            --task "python3 test_native_result_types.py" \
            --task "pytest -v -rxXs test_native_dml_interactions.py" \
            --task "python3 test_query_ast_materialization.py" \
            --task "python3 test_native_function_classification.py" \
            --task "python3 test_p1_pg_transition_vectorization.py" \
            --task "python3 test_p2_index_intelligence.py" \
            --task "python3 test_p2_window_partition_scoping.py" \
            --serial "python3 test_concurrent_backfill.py" \
            --serial "python3 test_minmax_group_arg_index.py" \
            --serial "python3 test_unrecognized_aggregates.py" \
            --serial "python3 test_avg_concurrent_maintenance.py" \
            --serial "pytest -v -rxXs test_native_bulk_statements.py" \
            --serial "pytest -v -rxXs -s test_pg_statement_maintenance.py" \
            --serial "python3 test_registration_replacement.py" \
            --serial "python3 test_registration_lifecycle.py" \
            --serial "python3 test_bulk_changes_safety.py" \
            --serial "python3 test_p1_engine_codegen.py"

      - name: Archive fuzz campaign manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-campaign-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: fuzz-campaign*.json
          if-no-files-found: ignore
          retention-days: 30

  # Both supported Oracle MySQL LTS series are required on every PR.
  mysql:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    name: MySQL ${{ matrix.mysql-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ["8.4", "9.7"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MySQL ${{ matrix.mysql-version }} container
        env:
          MYSQL_IMAGE: mysql:${{ matrix.mysql-version }}
        run: |
          docker pull "$MYSQL_IMAGE"
          docker run -d --name mysql-srv \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=matview_test \
            -p 3306:3306 \
            "$MYSQL_IMAGE" \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --innodb-flush-log-at-trx-commit=0 \
            --sync-binlog=0 \
            --skip-log-bin
          for i in $(seq 1 60); do
            if docker exec mysql-srv mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              echo "MySQL is ready!"
              exit 0
            fi
            sleep 2
          done
          docker logs mysql-srv
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verify actual MySQL server product and version
        env:
          MYSQL_DSN: "mysql://root:password@127.0.0.1:3306/matview_test"
          EXPECTED_MYSQL_PRODUCT: mysql
          EXPECTED_MYSQL_VERSION: ${{ matrix.mysql-version }}
          MATVIEW_CI_REQUESTED_IMAGE: mysql:${{ matrix.mysql-version }}
          MATVIEW_CI_ACTUAL_IMAGE: mysql:${{ matrix.mysql-version }}
        run: python3 verify_engine_matrix.py

      # Same layout as the postgres job: every task gets its own database.
      # Server memory is bounded by the native suites installing at most 16
      # views per base table (MySQL/MariaDB per-statement trigger memory grows
      # with the square of the views on a table; TODO.md "Share Float-Recompute
      # Triggers Per Table on MySQL/MariaDB"): 3 workers peak at ~3.2 GiB on
      # MariaDB 11.8 under a 7 GiB container cap.
      - name: Run the full test suite + live MySQL ${{ matrix.mysql-version }} modules in parallel (one database per task)
        env:
          MYSQL_DSN: "mysql://root:password@127.0.0.1:3306/matview_test"
          MATVIEW_FUZZ_TARGET: "MySQL ${{ matrix.mysql-version }}"
          MATVIEW_EMULATED_BACKENDS: skip
        run: |
          python3 scripts/ci_parallel.py --jobs 3 \
            --task "python3 test_matview_sync.py --suites 2-8" \
            --task "python3 test_matview_sync.py --suites 12 --seed-shard 0/2" \
            --task "python3 test_matview_sync.py --suites 12 --seed-shard 1/2" \
            --task "python3 test_matview_sync.py --suites 1" \
            --task "python3 test_matview_sync.py --suites 9-11,13,unit" \
            --task "python3 test_native_statistical_aggregates.py" \
            --task "python3 test_native_result_types.py" \
            --task "python3 test_group_key_collation.py" \
            --task "pytest -v -rxXs test_native_dml_interactions.py" \
            --task "python3 test_query_ast_materialization.py" \
            --task "python3 test_native_function_classification.py" \
            --task "python3 test_p1_manager_safety.py" \
            --task "python3 test_p1_sqlalchemy_integration.py" \
            --task "python3 test_p2_index_intelligence.py" \
            --task "python3 test_p2_window_partition_scoping.py" \
            --serial "python3 test_concurrent_backfill.py" \
            --serial "python3 test_minmax_group_arg_index.py" \
            --serial "python3 test_unrecognized_aggregates.py" \
            --serial "python3 test_avg_concurrent_maintenance.py" \
            --serial "pytest -v -rxXs test_native_bulk_statements.py" \
            --serial "python3 test_registration_replacement.py" \
            --serial "python3 test_registration_lifecycle.py" \
            --serial "python3 test_bulk_changes_safety.py" \
            --serial "python3 test_p1_engine_codegen.py"
      - name: Archive fuzz campaign manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-campaign-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: fuzz-campaign*.json
          if-no-files-found: ignore
          retention-days: 30

      # A "Lost connection" in a test is a client-side symptom: keep the server's own
      # log (a crash, an out-of-memory kill or a restart shows up here) with the run.
      - name: Dump the database server log on failure
        if: failure()
        run: |
          # OOMKilled=true (exit 137) proves a kernel OOM kill of the server.
          docker inspect -f 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Status={{.State.Status}}' mysql-srv
          docker stats --no-stream mysql-srv || true
          free -m || true
          # A host-wide OOM kill (no container limit) is logged by the kernel.
          sudo dmesg | grep -iE "out of memory|killed process" | tail -5 || true
          docker logs --tail 120 mysql-srv

  # Representative LTS boundaries for MariaDB: oldest, previous, newest LTS.
  mysql-compat:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "MariaDB 10.11 LTS"
            image: "mariadb:10.11"
            expected-product: "mariadb"
            expected-version: "10.11"
          - label: "MariaDB 11.8 LTS"
            image: "mariadb:11.8"
            expected-product: "mariadb"
            expected-version: "11.8"
          - label: "MariaDB 12.3 LTS"
            image: "mariadb:12.3"
            expected-product: "mariadb"
            expected-version: "12.3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ${{ matrix.label }} container
        env:
          MYSQL_IMAGE: ${{ matrix.image }}
        run: |
          docker pull "$MYSQL_IMAGE"
          # jemalloc (shipped in the MariaDB images) returns freed memory to the
          # OS; with glibc malloc the server keeps the peak of every trigger-heavy
          # statement and three parallel tasks reached 4.9+ GiB on MariaDB 11.8
          # vs 3.2 GiB peak with jemalloc. Allocator only: no SQL semantics.
          docker run -d --name mysql-compat-srv \
            -e LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2 \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MARIADB_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=matview_test \
            -e MARIADB_DATABASE=matview_test \
            -p 3306:3306 \
            "$MYSQL_IMAGE" \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --innodb-flush-log-at-trx-commit=0 \
            --sync-binlog=0 \
            --skip-log-bin
          for i in $(seq 1 60); do
            if docker exec mysql-compat-srv sh -c "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent || mariadb-admin ping -h 127.0.0.1 -uroot -ppassword --silent" 2>/dev/null; then
              echo "${{ matrix.label }} is ready!"
              malloc=$(docker exec mysql-compat-srv mariadb -h 127.0.0.1 -uroot -ppassword -N -e "SELECT @@version_malloc_library")
              echo "malloc library: $malloc"
              case "$malloc" in jemalloc*) exit 0 ;; *) echo "expected jemalloc"; exit 1 ;; esac
            fi
            sleep 2
          done
          docker logs mysql-compat-srv
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verify actual MariaDB product and version
        env:
          MYSQL_DSN: "mysql://root:password@127.0.0.1:3306/matview_test"
          EXPECTED_MYSQL_PRODUCT: ${{ matrix.expected-product }}
          EXPECTED_MYSQL_VERSION: ${{ matrix.expected-version }}
          MATVIEW_CI_REQUESTED_IMAGE: ${{ matrix.image }}
          MATVIEW_CI_ACTUAL_IMAGE: ${{ matrix.image }}
        run: python3 verify_engine_matrix.py

      # Same layout as the postgres job: every task gets its own database.
      # Server memory is bounded by the native suites installing at most 16
      # views per base table (MySQL/MariaDB per-statement trigger memory grows
      # with the square of the views on a table; TODO.md "Share Float-Recompute
      # Triggers Per Table on MySQL/MariaDB"): 3 workers peak at ~3.2 GiB on
      # MariaDB 11.8 under a 7 GiB container cap.
      - name: Run the full test suite + live ${{ matrix.label }} modules in parallel (one database per task)
        env:
          MYSQL_DSN: "mysql://root:password@127.0.0.1:3306/matview_test"
          MATVIEW_FUZZ_TARGET: "${{ matrix.label }}"
          MATVIEW_EMULATED_BACKENDS: skip
        run: |
          python3 scripts/ci_parallel.py --jobs 3 \
            --task "python3 test_matview_sync.py --suites 2-8" \
            --task "python3 test_matview_sync.py --suites 12 --seed-shard 0/2" \
            --task "python3 test_matview_sync.py --suites 12 --seed-shard 1/2" \
            --task "python3 test_matview_sync.py --suites 1" \
            --task "python3 test_matview_sync.py --suites 9-11,13,unit" \
            --task "python3 test_native_statistical_aggregates.py" \
            --task "python3 test_native_result_types.py" \
            --task "python3 test_group_key_collation.py" \
            --task "pytest -v -rxXs test_native_dml_interactions.py" \
            --task "python3 test_query_ast_materialization.py" \
            --task "python3 test_native_function_classification.py" \
            --task "python3 test_p1_manager_safety.py" \
            --task "python3 test_p1_sqlalchemy_integration.py" \
            --task "python3 test_p2_index_intelligence.py" \
            --task "python3 test_p2_window_partition_scoping.py" \
            --serial "python3 test_concurrent_backfill.py" \
            --serial "python3 test_minmax_group_arg_index.py" \
            --serial "python3 test_unrecognized_aggregates.py" \
            --serial "python3 test_avg_concurrent_maintenance.py" \
            --serial "pytest -v -rxXs test_native_bulk_statements.py" \
            --serial "python3 test_registration_replacement.py" \
            --serial "python3 test_registration_lifecycle.py" \
            --serial "python3 test_bulk_changes_safety.py" \
            --serial "python3 test_p1_engine_codegen.py"
      - name: Archive fuzz campaign manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-campaign-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: fuzz-campaign*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Dump the database server log on failure
        if: failure()
        run: |
          # OOMKilled=true (exit 137) proves a kernel OOM kill of the server.
          docker inspect -f 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Status={{.State.Status}}' mysql-compat-srv
          docker stats --no-stream mysql-compat-srv || true
          free -m || true
          # A host-wide OOM kill (no container limit) is logged by the kernel.
          sudo dmesg | grep -iE "out of memory|killed process" | tail -5 || true
          docker logs --tail 120 mysql-compat-srv

  # Stable branch-protection check. Only the required PR gate is aggregated;
  # scheduled/deferred compatibility jobs live in the separate workflow.
  ci-success:
    name: CI success
    if: ${{ always() }}
    # actions: read only here: the duration report lists this run's jobs.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    needs:
      - classify
      - docs-only
      - sqlite
      - sqlite-compat
      - postgres
      - mysql
      - mysql-compat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI gate job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_JSON"])
          docs_only = results["classify"]["outputs"].get("docs_only") == "true"
          required_jobs = (
              ["classify", "docs-only"]
              if docs_only
              else ["classify", "sqlite", "sqlite-compat", "postgres", "mysql", "mysql-compat"]
          )
          unsuccessful = {
              name: results[name]["result"]
              for name in required_jobs
              if results[name]["result"] != "success"
          }
          if unsuccessful:
              for name, result in sorted(unsuccessful.items()):
                  print(f"::error::{name} did not succeed (result: {result})")
              sys.exit(1)

          if docs_only:
              print("Documentation-only PR: matrix skipped; docs-only gate succeeded.")
          else:
              print("All required CI jobs succeeded.")
          PY

      # Owner budget: every CI job should finish within 15 minutes. Report each
      # job's duration and warn (annotation, not a failure: runner speed varies)
      # on every job over budget. Runs after the gate verdict, never changes it.
      - name: Report job durations against the 15-minute budget
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100
          BUDGET_MINUTES: "15"
        run: |
          python3 - <<'DURATIONS'
          import datetime, json, os, urllib.request

          req = urllib.request.Request(os.environ["JOBS_URL"], headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          })
          jobs = json.load(urllib.request.urlopen(req, timeout=30))["jobs"]
          budget = float(os.environ["BUDGET_MINUTES"])
          ts = lambda v: datetime.datetime.fromisoformat(v.replace("Z", "+00:00"))
          rows = []
          for job in jobs:
              if job.get("started_at") and job.get("completed_at") and job.get("conclusion") != "skipped":
                  queued = (ts(job["started_at"]) - ts(job["created_at"])).total_seconds() / 60
                  ran = (ts(job["completed_at"]) - ts(job["started_at"])).total_seconds() / 60
                  rows.append((ran, queued, job["name"]))
          lines = ["| job | ran (min) | queued (min) |", "|---|---:|---:|"]
          for ran, queued, name in sorted(rows, reverse=True):
              flag = " (over budget)" if ran > budget else ""
              lines.append(f"| {name}{flag} | {ran:.1f} | {queued:.1f} |")
              if ran > budget:
                  print(f"::warning::{name} took {ran:.1f} min (budget {budget:.0f} min)")
          lines.append(f"\nRunner minutes (completed jobs): {sum(r for r, _, _ in rows):.1f}")
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### Job durations (budget %.0f min)\n\n" % budget + "\n".join(lines) + "\n")
          DURATIONS
