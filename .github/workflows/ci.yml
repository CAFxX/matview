name: CI — Multi-Engine Materialized View Tests

# Matrix policy — keep this block and ci-deferred.yml in sync.
#
# PR-gate selection criteria:
# - Every row must exercise a distinct engine implementation, a materially
#   different supported major-version boundary, or a declared runtime boundary.
# - Keep the oldest supported stable line and the newest stable/LTS line where
#   their behavior can differ. Keep one representative for each genuinely
#   distinct engine family; do not build a Cartesian product of every engine,
#   engine version, Python version, driver version, and distribution.
# - Run the full deterministic suite and normal-scale fuzz campaign for every
#   PR-gate row. The stable CI success job aggregates only these required jobs.
#
# PR-gate dimensions:
# - Python: CPython 3.11 (oldest supported) and 3.15 (newest released) on the
#   standard SQLite path; Python 3.12 is used for every live-engine job. Python
#   3.13–3.14 are exercised in ci-deferred.yml.
# - SQLite: CPython's bundled sqlite3 plus one current representative of APSW,
#   SQLCipher, and libSQL. The alternative drivers run on Python 3.12, not across
#   every Python version.
# - PostgreSQL: native upstream 15 (oldest supported major) and 18 (newest).
#   PostgreSQL 16–17 and one Percona PostgreSQL 18 build are deferred weekly.
#   PostgreSQL 14 is removed: upstream support ends 2026-11-12.
# - MySQL: upstream 8.4 and 9.7 LTS lines are both required. Innovation 26.10
#   and Percona Server 8.4/9.7 are deferred weekly.
# - MariaDB: 10.11 (oldest selected LTS), 11.8, and 12.3 (newest LTS) are
#   required. LTS 11.4 and current rolling 13.1 are deferred weekly. MariaDB
#   13.0 is not carried forward because its community maintenance ends Q4 2026.
# - Vendor/extension images: Percona distributions are deferred as representative
#   vendor-build checks, not repeated for every upstream major. TimescaleDB,
#   PostGIS, and pgvector images are excluded from CI until tests actually create
#   and exercise their extensions; image startup alone is not extension coverage.
# - Fuzzing: normal-scale differential fuzzing remains in every full-suite job.
#   Scale-3 stress campaigns are deferred weekly, not repeated on each PR.
#
# Dependency and environment dimensions:
# - requirements.txt declares sqlglot>=25.0.0, psycopg2-binary>=2.9.9 and
#   cryptography>=41.0.0 for Python <3.15, and pymysql>=1.1.0. PR jobs resolve
#   the newest compatible releases; ci-deferred.yml tests these declared lower
#   bounds on Python 3.11 against live PostgreSQL and MySQL.
# - Optional SQLite drivers (apsw, apsw-sqlite3mc, sqlcipher3-binary,
#   sqlean.py, libsql-experimental) have no declared lower bounds. CI therefore
#   tests the newest installable release only; it makes no oldest-driver-version
#   compatibility claim. Define a minimum before adding such a version lane.
# - Docker tags select a server major/LTS/rolling line and therefore its current
#   patch release; patch versions are not a separate matrix dimension. No silent
#   image fallback is allowed: a missing requested tag must fail the job.
# - Runner/OS is ubuntu-latest (GitHub-hosted x64); Windows, macOS, other Linux
#   distributions, and other architectures are not currently CI support claims.
#   Action versions are pinned by major (checkout v4, setup-python v5), not
#   cross-producted. Review action upgrades separately.
#
# Deferred weekly coverage is implemented in ci-deferred.yml:
# Python 3.13–3.14; PostgreSQL 16–17 and Percona PostgreSQL 18; MySQL 26.10
# Innovation; MariaDB 11.4 and 13.1 rolling; Percona MySQL 8.4 and 9.7;
# SQLite3MC and sqlean; minimum declared Python dependency versions; and all
# six scale-3 fuzz campaigns. Extensions without feature tests are excluded,
# not deferred.

# Keep only the newest run for a given workflow + source branch. Using the
# same branch key for push and pull_request events also deduplicates those
# event types when both apply to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "master"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Standard-library SQLite at the oldest and newest supported CPython ends.
  sqlite:
    name: SQLite 3 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Verify SQLite library version
        run: python3 -c "import sqlite3; print('SQLite version:', sqlite3.sqlite_version)"

      - name: Run full test suite (SQLite + cross-dialect transpiled suites)
        run: python3 test_matview_sync.py

      - name: Test independent-session backfill concurrency
        run: python3 test_concurrent_backfill.py

  # One representative build per distinct SQLite-compatible implementation.
  sqlite-compat:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "APSW SQLite"
            engine: "apsw"
            pip-pkg: "apsw"
          - label: "SQLCipher 4"
            engine: "sqlcipher"
            pip-pkg: "sqlcipher3-binary"
          - label: "Turso libSQL"
            engine: "libsql"
            pip-pkg: "libsql-experimental"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies and SQLite driver
        env:
          ENGINE: ${{ matrix.engine }}
          PIP_PACKAGE: ${{ matrix.pip-pkg }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          if [ "$ENGINE" = "sqlcipher" ]; then
            sudo apt-get update
            sudo apt-get install -y libsqlcipher-dev sqlcipher
            python3 -m pip install sqlcipher3-binary || python3 -m pip install sqlcipher3
          elif [ "$ENGINE" = "libsql" ]; then
            python3 -m pip install libsql-experimental || python3 -m pip install libsql
          else
            python3 -m pip install "$PIP_PACKAGE"
          fi

      - name: Run full test suite + live ${{ matrix.label }} integration tests
        env:
          SQLITE_COMPAT_ENGINE: ${{ matrix.engine }}
        run: python3 test_matview_sync.py

  # Oldest and newest supported upstream PostgreSQL major versions.
  postgres:
    name: PostgreSQL ${{ matrix.pg-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg-version: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: matview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d matview_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run full test suite + live PostgreSQL ${{ matrix.pg-version }} integration tests
        env:
          POSTGRES_DSN: "postgresql://postgres:password@127.0.0.1:5432/matview_test"
        run: python3 test_matview_sync.py

  # Both supported Oracle MySQL LTS series are required on every PR.
  mysql:
    name: MySQL ${{ matrix.mysql-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ["8.4", "9.7"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MySQL ${{ matrix.mysql-version }} container
        env:
          MYSQL_IMAGE: mysql:${{ matrix.mysql-version }}
        run: |
          docker pull "$MYSQL_IMAGE"
          docker run -d --name mysql-srv \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=matview_test \
            -p 3306:3306 \
            "$MYSQL_IMAGE" \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --innodb-flush-log-at-trx-commit=0 \
            --sync-binlog=0 \
            --skip-log-bin
          for i in $(seq 1 60); do
            if docker exec mysql-srv mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              echo "MySQL is ready!"
              exit 0
            fi
            sleep 2
          done
          docker logs mysql-srv
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run full test suite + live MySQL ${{ matrix.mysql-version }} integration tests
        env:
          MYSQL_DSN: "mysql://root:password@127.0.0.1:3306/matview_test"
        run: python3 test_matview_sync.py

  # Representative LTS boundaries for MariaDB: oldest, previous, newest LTS.
  mysql-compat:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "MariaDB 10.11 LTS"
            image: "mariadb:10.11"
          - label: "MariaDB 11.8 LTS"
            image: "mariadb:11.8"
          - label: "MariaDB 12.3 LTS"
            image: "mariadb:12.3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ${{ matrix.label }} container
        env:
          MYSQL_IMAGE: ${{ matrix.image }}
        run: |
          docker pull "$MYSQL_IMAGE"
          docker run -d --name mysql-compat-srv \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MARIADB_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=matview_test \
            -e MARIADB_DATABASE=matview_test \
            -p 3306:3306 \
            "$MYSQL_IMAGE" \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --innodb-flush-log-at-trx-commit=0 \
            --sync-binlog=0 \
            --skip-log-bin
          for i in $(seq 1 60); do
            if docker exec mysql-compat-srv sh -c "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent || mariadb-admin ping -h 127.0.0.1 -uroot -ppassword --silent" 2>/dev/null; then
              echo "${{ matrix.label }} is ready!"
              exit 0
            fi
            sleep 2
          done
          docker logs mysql-compat-srv
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run full test suite + live ${{ matrix.label }} integration tests
        env:
          MYSQL_DSN: "mysql://root:password@127.0.0.1:3306/matview_test"
        run: python3 test_matview_sync.py

  # Stable branch-protection check. Only the required PR gate is aggregated;
  # scheduled/deferred compatibility jobs live in the separate workflow.
  ci-success:
    name: CI success
    if: ${{ always() }}
    needs:
      - sqlite
      - sqlite-compat
      - postgres
      - mysql
      - mysql-compat
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI gate job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_JSON"])
          unsuccessful = {
              name: result["result"]
              for name, result in results.items()
              if result["result"] != "success"
          }
          if unsuccessful:
              for name, result in sorted(unsuccessful.items()):
                  print(f"::error::{name} did not succeed (result: {result})")
              sys.exit(1)

          print(f"All {len(results)} required CI jobs succeeded.")
          PY
