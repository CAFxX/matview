name: CI — Multi-Engine Materialized View Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # =========================================================================
  # 1. SQLite 3 (Standard Library across all non-EoL Python versions)
  # =========================================================================
  sqlite:
    name: SQLite 3 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All active non-EoL Python releases as of Nov 2026 (Python 3.10 reached EoL in Oct 2026)
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Verify SQLite library version
        run: python3 -c "import sqlite3; print('SQLite version:', sqlite3.sqlite_version)"

      - name: Run full test suite (SQLite + cross-dialect transpiled suites)
        run: python3 test_matview_sync.py

  # =========================================================================
  # 2. SQLite-Compatible Engines & Distributions (APSW, SQLite3MC, SQLCipher, sqlean, Turso libSQL)
  # =========================================================================
  sqlite-compat:
    name: ${{ matrix.label }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # APSW (Another Python SQLite Wrapper)
          - label: "APSW SQLite"
            engine: "apsw"
            pip-pkg: "apsw"
            apt-pkg: ""
            python-version: "3.11"
          - label: "APSW SQLite"
            engine: "apsw"
            pip-pkg: "apsw"
            apt-pkg: ""
            python-version: "3.12"
          - label: "APSW SQLite"
            engine: "apsw"
            pip-pkg: "apsw"
            apt-pkg: ""
            python-version: "3.13"
          - label: "APSW SQLite"
            engine: "apsw"
            pip-pkg: "apsw"
            apt-pkg: ""
            python-version: "3.14"

          # SQLite3 Multiple Ciphers (apsw-sqlite3mc)
          - label: "SQLite3 Multiple Ciphers"
            engine: "sqlite3mc"
            pip-pkg: "apsw-sqlite3mc"
            apt-pkg: ""
            python-version: "3.11"
          - label: "SQLite3 Multiple Ciphers"
            engine: "sqlite3mc"
            pip-pkg: "apsw-sqlite3mc"
            apt-pkg: ""
            python-version: "3.12"
          - label: "SQLite3 Multiple Ciphers"
            engine: "sqlite3mc"
            pip-pkg: "apsw-sqlite3mc"
            apt-pkg: ""
            python-version: "3.13"
          - label: "SQLite3 Multiple Ciphers"
            engine: "sqlite3mc"
            pip-pkg: "apsw-sqlite3mc"
            apt-pkg: ""
            python-version: "3.14"

          # SQLCipher 4 (sqlcipher3)
          - label: "SQLCipher 4"
            engine: "sqlcipher"
            pip-pkg: "sqlcipher3-binary"
            apt-pkg: "libsqlcipher-dev sqlcipher"
            python-version: "3.11"
          - label: "SQLCipher 4"
            engine: "sqlcipher"
            pip-pkg: "sqlcipher3-binary"
            apt-pkg: "libsqlcipher-dev sqlcipher"
            python-version: "3.12"
          - label: "SQLCipher 4"
            engine: "sqlcipher"
            pip-pkg: "sqlcipher3-binary"
            apt-pkg: "libsqlcipher-dev sqlcipher"
            python-version: "3.13"

          # sqlean.py (SQLite with bundled extension suite)
          - label: "sqlean SQLite"
            engine: "sqlean"
            pip-pkg: "sqlean.py"
            apt-pkg: ""
            python-version: "3.11"
          - label: "sqlean SQLite"
            engine: "sqlean"
            pip-pkg: "sqlean.py"
            apt-pkg: ""
            python-version: "3.12"

          # Turso libSQL
          - label: "Turso libSQL"
            engine: "libsql"
            pip-pkg: "libsql-experimental"
            apt-pkg: ""
            python-version: "3.11"
          - label: "Turso libSQL"
            engine: "libsql"
            pip-pkg: "libsql-experimental"
            apt-pkg: ""
            python-version: "3.12"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system & Python driver packages for ${{ matrix.label }}
        run: |
          if [ -n "${{ matrix.apt-pkg }}" ]; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.apt-pkg }}
          fi
          python3 -m pip install --upgrade pip
          if [ "${{ matrix.engine }}" = "sqlcipher" ]; then
            python3 -m pip install sqlcipher3-binary || python3 -m pip install sqlcipher3
          elif [ "${{ matrix.engine }}" = "libsql" ]; then
            python3 -m pip install libsql-experimental || python3 -m pip install libsql
          else
            python3 -m pip install ${{ matrix.pip-pkg }}
          fi

      - name: Run full test suite + live ${{ matrix.label }} integration tests
        env:
          SQLITE_COMPAT_ENGINE: ${{ matrix.engine }}
        run: python3 test_matview_sync.py

  # =========================================================================
  # 3. PostgreSQL (All active non-EoL major versions: 14, 15, 16, 17, 18)
  # =========================================================================
  postgres:
    name: PostgreSQL ${{ matrix.pg-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg-version: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: matview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d matview_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL driver
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install psycopg2-binary

      - name: Run full test suite + live PostgreSQL ${{ matrix.pg-version }} integration tests
        env:
          POSTGRES_DSN: "postgresql://postgres:password@127.0.0.1:5432/matview_test"
        run: python3 test_matview_sync.py

  # =========================================================================
  # 4. PostgreSQL-Compatible Engines (Percona PG, TimescaleDB, PostGIS, pgvector)
  # =========================================================================
  postgres-compat:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Percona Distribution for PostgreSQL (14–18)
          - label: "Percona PostgreSQL 14"
            image: "percona/percona-distribution-postgresql:14"
          - label: "Percona PostgreSQL 15"
            image: "percona/percona-distribution-postgresql:15"
          - label: "Percona PostgreSQL 16"
            image: "percona/percona-distribution-postgresql:16"
          - label: "Percona PostgreSQL 17"
            image: "percona/percona-distribution-postgresql:17"
          - label: "Percona PostgreSQL 18"
            image: "percona/percona-distribution-postgresql:18"

          # TimescaleDB (14–18)
          - label: "TimescaleDB (PG 14)"
            image: "timescale/timescaledb:latest-pg14"
          - label: "TimescaleDB (PG 15)"
            image: "timescale/timescaledb:latest-pg15"
          - label: "TimescaleDB (PG 16)"
            image: "timescale/timescaledb:latest-pg16"
          - label: "TimescaleDB (PG 17)"
            image: "timescale/timescaledb:latest-pg17"
          - label: "TimescaleDB (PG 18)"
            image: "timescale/timescaledb:latest-pg18"

          # PostGIS 3.6 (14–18)
          - label: "PostGIS 3.6 (PG 14)"
            image: "postgis/postgis:14-3.6"
          - label: "PostGIS 3.6 (PG 15)"
            image: "postgis/postgis:15-3.6"
          - label: "PostGIS 3.6 (PG 16)"
            image: "postgis/postgis:16-3.6"
          - label: "PostGIS 3.6 (PG 17)"
            image: "postgis/postgis:17-3.6"
          - label: "PostGIS 3.6 (PG 18)"
            image: "postgis/postgis:18-3.6"

          # pgvector (14–18)
          - label: "pgvector (PG 14)"
            image: "pgvector/pgvector:pg14"
          - label: "pgvector (PG 15)"
            image: "pgvector/pgvector:pg15"
          - label: "pgvector (PG 16)"
            image: "pgvector/pgvector:pg16"
          - label: "pgvector (PG 17)"
            image: "pgvector/pgvector:pg17"
          - label: "pgvector (PG 18)"
            image: "pgvector/pgvector:pg18"
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: matview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL driver
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install psycopg2-binary

      - name: Run full test suite + live ${{ matrix.label }} integration tests
        env:
          POSTGRES_DSN: "postgresql://postgres:password@127.0.0.1:5432/matview_test"
        run: python3 test_matview_sync.py

  # =========================================================================
  # 5. Oracle MySQL (All active non-EoL versions: 8.4 LTS, 9.7 LTS, 26.10 Innovation)
  # =========================================================================
  mysql:
    name: MySQL ${{ matrix.mysql-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ["8.4", "9.7", "26.10"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MySQL ${{ matrix.mysql-version }} container
        run: |
          IMG="mysql:${{ matrix.mysql-version }}"
          if ! docker pull "$IMG"; then
            IMG="mysql:innovation"
            docker pull "$IMG"
          fi
          docker run -d --name mysql-srv \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=matview_test \
            -p 3306:3306 \
            "$IMG" \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --innodb-flush-log-at-trx-commit=0 \
            --sync-binlog=0 \
            --skip-log-bin
          for i in $(seq 1 60); do
            if docker exec mysql-srv mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              echo "MySQL is ready!"
              break
            fi
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyMySQL driver
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pymysql cryptography

      - name: Run full test suite + live MySQL ${{ matrix.mysql-version }} integration tests
        env:
          MYSQL_DSN: "mysql://root:password@127.0.0.1:3306/matview_test"
        run: python3 test_matview_sync.py

  # =========================================================================
  # 6. MySQL-Compatible Engines (MariaDB 10.11–13.0, Percona Server 8.4 & 9.7)
  # =========================================================================
  mysql-compat:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "MariaDB 10.11 LTS"
            image: "mariadb:10.11"
            fallback: "mariadb:10.11"
          - label: "MariaDB 11.4 LTS"
            image: "mariadb:11.4"
            fallback: "mariadb:11.4"
          - label: "MariaDB 11.8 LTS"
            image: "mariadb:11.8"
            fallback: "mariadb:11.8"
          - label: "MariaDB 12.3 LTS"
            image: "mariadb:12.3"
            fallback: "mariadb:latest"
          - label: "MariaDB 13.0 Rolling"
            image: "mariadb:13.0"
            fallback: "mariadb:lts"
          - label: "Percona Server for MySQL 8.4 LTS"
            image: "percona/percona-server:8.4"
            fallback: "percona/percona-server:8.4"
          - label: "Percona Server for MySQL 9.7"
            image: "percona/percona-server:9.7"
            fallback: "percona/percona-server:latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start ${{ matrix.label }} container
        run: |
          IMG="${{ matrix.image }}"
          if ! docker pull "$IMG"; then
            IMG="${{ matrix.fallback }}"
            docker pull "$IMG"
          fi
          docker run -d --name mysql-compat-srv \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MARIADB_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=matview_test \
            -e MARIADB_DATABASE=matview_test \
            -p 3306:3306 \
            "$IMG" \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci \
            --innodb-flush-log-at-trx-commit=0 \
            --sync-binlog=0 \
            --skip-log-bin
          for i in $(seq 1 60); do
            if docker exec mysql-compat-srv sh -c "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent || mariadb-admin ping -h 127.0.0.1 -uroot -ppassword --silent" 2>/dev/null; then
              echo "${{ matrix.label }} is ready!"
              break
            fi
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyMySQL driver
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pymysql cryptography

      - name: Run full test suite + live ${{ matrix.label }} integration tests
        env:
          MYSQL_DSN: "mysql://root:password@127.0.0.1:3306/matview_test"
        run: python3 test_matview_sync.py
