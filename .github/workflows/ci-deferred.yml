name: CI — Deferred Compatibility Sweep

# This workflow owns the compatibility dimensions intentionally removed from
# the per-PR gate. It is not a required branch check.
#
# Schedule (measured job wall times from the 2026-11-09/16 runs in brackets):
# - Nightly (Mon-Sat 03:17 UTC): python-deferred [9-17 min], compatibility-sweep
#   [11-24 min] and dependency-minimum (~14 jobs, ~200 runner-minutes, about one
#   PR-gate run before stage 1).
# - Weekly (Sunday 03:17 UTC) and on demand: everything above plus the six
#   scale-3 fuzz-stress jobs [11-49 min, ~210 runner-minutes]; they stay weekly
#   because they cost as much as the rest of the sweep together.
# - Timeouts: 60 min for sweep jobs (2.5x the slowest measured), 90 min for
#   scale-3 fuzz (slowest measured 49 min), 10 min for the bookkeeping jobs.
#
# Ownership: a failing scheduled run opens, or comments on, ONE GitHub issue
# (label ci-deferred, scripts/ci_failure_issue.js, shared with ci-extended.yml).
# If repository Issues are disabled, that job fails with the report in its job
# summary instead (the failure stays visible).
# Scale-3 fuzz jobs upload fuzz-campaign.json and a failing-seed report with a
# replay command (scripts/fuzz_failure_report.py), as ci-extended.yml does.
#
# Deferred dimensions:
# - CPython 3.13 and 3.14 on standard SQLite. Python 3.11/3.15 are gate endpoints;
#   Python 3.12 is the runtime for all live-engine gate jobs.
# - PostgreSQL 16 and 17; one Percona Distribution for PostgreSQL 18 representative.
#   PostgreSQL 14 is retired because upstream support ends 2026-11-12.
# - MySQL 26.10 Innovation; MariaDB 11.4 LTS and 13.0 rolling; Percona Server for
#   MySQL 8.4 and 9.7. Gate coverage remains MySQL 8.4/9.7 LTS and MariaDB
#   10.11/11.8/12.3 LTS. MariaDB 13.1 has no stable Docker tag yet (only
#   13.1-rc and 13.1.1-rc on 2026-11-18; `mariadb:13.1` does not exist), so the
#   rolling row uses 13.0 (13.0.2 GA) until 13.1 is GA; then switch the row to
#   13.1. Release candidates are not support claims.
# - SQLite3MC and sqlean are periodic SQLite-build smoke checks. The current
#   suite does not verify cipher correctness or sqlean-specific extension APIs.
#   The sqlean row is allowed to fail (continue-on-error, with a warning
#   annotation): sqlean's bundled stats extension defines VAR_*/STDDEV_* with
#   different semantics from matview's SQLite maintenance (see TODO.md, "sqlean
#   Native Statistical Aggregates"). Remove allow-failure when that is resolved.
# - Minimum declared Python dependency versions are tested on Python 3.11 against
#   live PostgreSQL and MySQL. The pins are derived from requirements.txt at run
#   time (every `>=` floor becomes `==`), so the lane cannot drift from the
#   declared floors. Undeclared transitive dependencies resolve to their newest
#   compatible releases. The PR gate installs latest compatible versions.
# - Optional SQLite drivers have no declared minimum versions; this workflow
#   tests the latest installable releases, not a lower-bound compatibility claim.
# - Scale-3 fuzz campaigns run weekly. Every PR-gate full-suite job still runs
#   the ordinary deterministic suite and the fixed-seed fuzz campaign; the
#   random-seed scale-2 campaign runs in ci-extended.yml (push to master,
#   nightly, on demand).
#
# Excluded, not deferred: TimescaleDB, PostGIS, and pgvector images. Restore them
# only alongside tests that CREATE EXTENSION and exercise their respective APIs.

# One group per event and ref; never cancel a running sweep (a manual dispatch
# must not discard the nightly run, and vice versa).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

on:
  schedule:
    # Nightly sweep without scale-3 fuzz (Monday-Saturday).
    - cron: "17 3 * * 1-6"
    # Weekly full sweep including scale-3 fuzz (Sunday). Keep this string in
    # sync with the fuzz-stress `if:` and the deferred-success script.
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  python-deferred:
    name: CPython ${{ matrix.python-version }} / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Run full test suite
        run: python3 test_matview_sync.py

  compatibility-sweep:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only rows marked allow-failure (see the policy comment above) may fail
    # without failing the sweep; their failure still raises a warning.
    continue-on-error: ${{ matrix.allow-failure == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "SQLite3 Multiple Ciphers"
            kind: sqlite
            sqlite-engine: sqlite3mc
            driver-package: apsw-sqlite3mc
          - name: "sqlean SQLite"
            kind: sqlite
            sqlite-engine: sqlean
            driver-package: sqlean.py
            allow-failure: true
          - name: "PostgreSQL 16"
            kind: postgres
            image: postgres:16
            expected-pg-major: "16"
          - name: "PostgreSQL 17"
            kind: postgres
            image: postgres:17
            expected-pg-major: "17"
          - name: "Percona PostgreSQL 18"
            kind: postgres
            image: percona/percona-distribution-postgresql:18
            expected-pg-major: "18"
          - name: "MySQL 26.10 Innovation"
            kind: mysql
            image: mysql:26.10
            expected-product: "mysql"
            expected-version: "26.10"
          - name: "MariaDB 11.4 LTS"
            kind: mysql
            image: mariadb:11.4
            expected-product: "mariadb"
            expected-version: "11.4"
          - name: "MariaDB 13.0 Rolling"
            kind: mysql
            image: mariadb:13.0
            expected-product: "mariadb"
            expected-version: "13.0"
          - name: "Percona Server for MySQL 8.4"
            kind: mysql
            image: percona/percona-server:8.4
            expected-product: "percona"
            expected-version: "8.4"
          - name: "Percona Server for MySQL 9.7"
            kind: mysql
            image: percona/percona-server:9.7
            expected-product: "percona"
            expected-version: "9.7"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies and optional SQLite driver
        env:
          KIND: ${{ matrix.kind }}
          DRIVER_PACKAGE: ${{ matrix.driver-package }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          if [ "$KIND" = "sqlite" ]; then
            python3 -m pip install "$DRIVER_PACKAGE"
          fi

      - name: Start live database
        if: ${{ matrix.kind != 'sqlite' }}
        env:
          KIND: ${{ matrix.kind }}
          IMAGE: ${{ matrix.image }}
          LABEL: ${{ matrix.name }}
        run: |
          docker pull "$IMAGE"
          if [ "$KIND" = "postgres" ]; then
            docker run -d --name pg-srv \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=password \
              -e POSTGRES_DB=matview_test \
              -p 5432:5432 \
              "$IMAGE"
            for i in $(seq 1 60); do
              if docker exec pg-srv pg_isready -U postgres -d matview_test; then
                echo "$LABEL is ready!"
                exit 0
              fi
              sleep 2
            done
            docker logs pg-srv
            exit 1
          else
            docker run -d --name mysql-srv \
              -e MYSQL_ROOT_PASSWORD=password \
              -e MARIADB_ROOT_PASSWORD=password \
              -e MYSQL_DATABASE=matview_test \
              -e MARIADB_DATABASE=matview_test \
              -p 3306:3306 \
              "$IMAGE" \
              --character-set-server=utf8mb4 \
              --collation-server=utf8mb4_unicode_ci \
              --innodb-flush-log-at-trx-commit=0 \
              --sync-binlog=0 \
              --skip-log-bin
            for i in $(seq 1 60); do
              if docker exec mysql-srv sh -c "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent || mariadb-admin ping -h 127.0.0.1 -uroot -ppassword --silent" 2>/dev/null; then
                echo "$LABEL is ready!"
                exit 0
              fi
              sleep 2
            done
            docker logs mysql-srv
            exit 1
          fi

      - name: Verify actual PostgreSQL/MySQL/MariaDB server version
        if: ${{ matrix.kind != 'sqlite' }}
        env:
          POSTGRES_DSN: ${{ matrix.kind == 'postgres' && 'postgresql://postgres:password@127.0.0.1:5432/matview_test' || '' }}
          MYSQL_DSN: ${{ matrix.kind == 'mysql' && 'mysql://root:password@127.0.0.1:3306/matview_test' || '' }}
          EXPECTED_PG_MAJOR: ${{ matrix.expected-pg-major }}
          EXPECTED_PG_LABEL: ${{ matrix.name }}
          EXPECTED_MYSQL_PRODUCT: ${{ matrix.expected-product }}
          EXPECTED_MYSQL_VERSION: ${{ matrix.expected-version }}
          EXPECTED_MYSQL_LABEL: ${{ matrix.name }}
          MATVIEW_CI_REQUESTED_IMAGE: ${{ matrix.image }}
          MATVIEW_CI_ACTUAL_IMAGE: ${{ matrix.image }}
        run: python3 verify_engine_matrix.py

      - name: Run full test suite
        env:
          POSTGRES_DSN: ${{ matrix.kind == 'postgres' && 'postgresql://postgres:password@127.0.0.1:5432/matview_test' || '' }}
          MYSQL_DSN: ${{ matrix.kind == 'mysql' && 'mysql://root:password@127.0.0.1:3306/matview_test' || '' }}
          SQLITE_COMPAT_ENGINE: ${{ matrix.sqlite-engine || '' }}
        run: python3 test_matview_sync.py

      - name: Flag an allowed failure
        if: ${{ failure() && matrix.allow-failure == true }}
        env:
          LABEL: ${{ matrix.name }}
        run: |
          msg="$LABEL failed but is allowed to fail (known divergence, see TODO.md and the ci-deferred.yml policy comment); it does not fail the sweep."
          echo "::warning title=Allowed failure: $LABEL::$msg"
          echo "### Allowed failure: $LABEL" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  dependency-minimum:
    name: Minimum declared dependencies / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "PostgreSQL 18"
            kind: postgres
            image: postgres:18
            expected-pg-major: "18"
          - name: "MySQL 9.7"
            kind: mysql
            image: mysql:9.7
            expected-product: "mysql"
            expected-version: "9.7"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start live database
        env:
          KIND: ${{ matrix.kind }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker pull "$IMAGE"
          if [ "$KIND" = "postgres" ]; then
            docker run -d --name db-srv \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=password \
              -e POSTGRES_DB=matview_test \
              -p 5432:5432 \
              "$IMAGE"
            for i in $(seq 1 60); do
              if docker exec db-srv pg_isready -U postgres -d matview_test; then
                exit 0
              fi
              sleep 2
            done
          else
            docker run -d --name db-srv \
              -e MYSQL_ROOT_PASSWORD=password \
              -e MYSQL_DATABASE=matview_test \
              -p 3306:3306 \
              "$IMAGE" \
              --character-set-server=utf8mb4 \
              --collation-server=utf8mb4_unicode_ci \
              --innodb-flush-log-at-trx-commit=0 \
              --sync-binlog=0 \
              --skip-log-bin
            for i in $(seq 1 60); do
              if docker exec db-srv mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
                exit 0
              fi
              sleep 2
            done
          fi
          docker logs db-srv
          exit 1

      - name: Set up minimum supported Python dependency versions
        run: |
          python3 -m pip install --upgrade pip
          # Pin every declared floor exactly; fail if a requirement has none.
          if grep -vE '^\s*(#|$)' requirements.txt | grep -v '>='; then
            echo "::error::every requirements.txt entry needs a >= floor for this lane"
            exit 1
          fi
          sed -E 's/>=/==/' requirements.txt > min-requirements.txt
          cat min-requirements.txt
          python3 -m pip install -r min-requirements.txt
          python3 -m pip check
          python3 -m pip freeze

      - name: Verify actual PostgreSQL/MySQL/MariaDB server version
        env:
          POSTGRES_DSN: ${{ matrix.kind == 'postgres' && 'postgresql://postgres:password@127.0.0.1:5432/matview_test' || '' }}
          MYSQL_DSN: ${{ matrix.kind == 'mysql' && 'mysql://root:password@127.0.0.1:3306/matview_test' || '' }}
          EXPECTED_PG_MAJOR: ${{ matrix.expected-pg-major }}
          EXPECTED_PG_LABEL: ${{ matrix.name }}
          EXPECTED_MYSQL_PRODUCT: ${{ matrix.expected-product }}
          EXPECTED_MYSQL_VERSION: ${{ matrix.expected-version }}
          EXPECTED_MYSQL_LABEL: ${{ matrix.name }}
          MATVIEW_CI_REQUESTED_IMAGE: ${{ matrix.image }}
          MATVIEW_CI_ACTUAL_IMAGE: ${{ matrix.image }}
        run: python3 verify_engine_matrix.py

      - name: Run full test suite with minimum dependencies
        env:
          POSTGRES_DSN: ${{ matrix.kind == 'postgres' && 'postgresql://postgres:password@127.0.0.1:5432/matview_test' || '' }}
          MYSQL_DSN: ${{ matrix.kind == 'mysql' && 'mysql://root:password@127.0.0.1:3306/matview_test' || '' }}
        run: python3 test_matview_sync.py

  fuzz-stress:
    name: Scale-3 differential fuzz / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Weekly schedule and manual runs only; the nightly schedule skips it.
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '17 3 * * 0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "SQLite 3 + transpiled PostgreSQL/MySQL"
            backend: sqlite
            scale: "3"
            replay-env: ""
          - label: "APSW SQLite"
            backend: apsw
            scale: "3"
            replay-env: "SQLITE_COMPAT_ENGINE=apsw"
          - label: "PostgreSQL 17"
            backend: postgres
            pg-image: postgres:17
            scale: "3"
            expected-pg-major: "17"
            replay-env: "POSTGRES_DSN=postgresql://postgres:password@127.0.0.1:5432/matview_test"
          - label: "PostgreSQL 18"
            backend: postgres
            pg-image: postgres:18
            scale: "3"
            expected-pg-major: "18"
            replay-env: "POSTGRES_DSN=postgresql://postgres:password@127.0.0.1:5432/matview_test"
          - label: "MySQL 8.4"
            backend: mysql
            mysql-image: mysql:8.4
            scale: "3"
            expected-product: "mysql"
            expected-version: "8.4"
            replay-env: "MYSQL_DSN=mysql://root:password@127.0.0.1:3306/matview_test"
          - label: "MariaDB 11.4"
            backend: mysql
            mysql-image: mariadb:11.4
            scale: "3"
            expected-product: "mariadb"
            expected-version: "11.4"
            replay-env: "MYSQL_DSN=mysql://root:password@127.0.0.1:3306/matview_test"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies and APSW when selected
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          if [ "$BACKEND" = "apsw" ]; then
            python3 -m pip install apsw
          fi

      - name: Start fuzz database
        if: ${{ matrix.backend == 'postgres' || matrix.backend == 'mysql' }}
        env:
          BACKEND: ${{ matrix.backend }}
          PG_IMAGE: ${{ matrix.pg-image }}
          MYSQL_IMAGE: ${{ matrix.mysql-image }}
        run: |
          if [ "$BACKEND" = "postgres" ]; then
            docker pull "$PG_IMAGE"
            docker run -d --name fuzz-srv \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=password \
              -e POSTGRES_DB=matview_test \
              -p 5432:5432 \
              "$PG_IMAGE"
            for i in $(seq 1 60); do
              if docker exec fuzz-srv pg_isready -U postgres -d matview_test; then
                exit 0
              fi
              sleep 2
            done
          else
            docker pull "$MYSQL_IMAGE"
            docker run -d --name fuzz-srv \
              -e MYSQL_ROOT_PASSWORD=password \
              -e MARIADB_ROOT_PASSWORD=password \
              -e MYSQL_DATABASE=matview_test \
              -e MARIADB_DATABASE=matview_test \
              -p 3306:3306 \
              "$MYSQL_IMAGE" \
              --character-set-server=utf8mb4 \
              --collation-server=utf8mb4_unicode_ci \
              --innodb-flush-log-at-trx-commit=0 \
              --sync-binlog=0 \
              --skip-log-bin
            for i in $(seq 1 60); do
              if docker exec fuzz-srv sh -c "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent || mariadb-admin ping -h 127.0.0.1 -uroot -ppassword --silent" 2>/dev/null; then
                exit 0
              fi
              sleep 2
            done
          fi
          docker logs fuzz-srv
          exit 1

      - name: Verify actual PostgreSQL/MySQL/MariaDB server version
        if: ${{ matrix.backend == 'postgres' || matrix.backend == 'mysql' }}
        env:
          POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgresql://postgres:password@127.0.0.1:5432/matview_test' || '' }}
          MYSQL_DSN: ${{ matrix.backend == 'mysql' && 'mysql://root:password@127.0.0.1:3306/matview_test' || '' }}
          EXPECTED_PG_MAJOR: ${{ matrix.expected-pg-major }}
          EXPECTED_PG_LABEL: ${{ matrix.label }}
          EXPECTED_MYSQL_PRODUCT: ${{ matrix.expected-product }}
          EXPECTED_MYSQL_VERSION: ${{ matrix.expected-version }}
          EXPECTED_MYSQL_LABEL: ${{ matrix.label }}
          MATVIEW_CI_REQUESTED_IMAGE: ${{ matrix.pg-image || matrix.mysql-image }}
          MATVIEW_CI_ACTUAL_IMAGE: ${{ matrix.pg-image || matrix.mysql-image }}
        run: python3 verify_engine_matrix.py

      - name: Run scale-3 differential fuzzer
        env:
          BACKEND: ${{ matrix.backend }}
          FUZZ_SCALE: ${{ matrix.scale }}
          MATVIEW_FUZZ_TARGET: "Scale-3 / ${{ matrix.label }}"
          POSTGRES_DSN: ${{ matrix.backend == 'postgres' && 'postgresql://postgres:password@127.0.0.1:5432/matview_test' || '' }}
          MYSQL_DSN: ${{ matrix.backend == 'mysql' && 'mysql://root:password@127.0.0.1:3306/matview_test' || '' }}
        run: |
          if [ "$BACKEND" = "apsw" ]; then
            SQLITE_COMPAT_ENGINE=apsw python3 test_matview_sync.py --fuzz --fuzz-scale "$FUZZ_SCALE"
          else
            python3 test_matview_sync.py --fuzz --fuzz-scale "$FUZZ_SCALE"
          fi

      - name: Report failing seeds with replay commands
        if: always()
        env:
          TARGET: "Scale-3 / ${{ matrix.label }} (${{ matrix.pg-image || matrix.mysql-image || matrix.backend }})"
          REPLAY_ENV: ${{ matrix.replay-env }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/fuzz_failure_report.py \
          --target "$TARGET" \
          --engine-env "$REPLAY_ENV" \
          --run-url "$RUN_URL"

      - name: Archive fuzz manifest and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-deferred-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: |
            fuzz-campaign.json
            fuzz-report/
          if-no-files-found: ignore
          retention-days: 30

  deferred-success:
    name: Deferred CI success
    if: ${{ always() }}
    needs:
      - python-deferred
      - compatibility-sweep
      - dependency-minimum
      - fuzz-stress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every deferred job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_JSON"])
          # Only the nightly schedule skips the weekly scale-3 fuzz jobs; any
          # other skip (or a skip of another job) is a failure.
          nightly = os.environ["EVENT_NAME"] == "schedule" and os.environ["EVENT_SCHEDULE"] != "17 3 * * 0"
          may_skip = {"fuzz-stress"} if nightly else set()
          unsuccessful = {
              name: result["result"]
              for name, result in results.items()
              if result["result"] != "success"
              and not (result["result"] == "skipped" and name in may_skip)
          }
          if unsuccessful:
              for name, result in sorted(unsuccessful.items()):
                  print(f"::error::{name} did not succeed (result: {result})")
              sys.exit(1)

          print(f"All {len(results)} deferred CI jobs succeeded.")
          PY

  # Owned failure signal: one open issue (label ci-deferred), commented on by
  # every later failing scheduled run. Manual runs report only in the run.
  report-failure:
    name: Open or update the deferred-sweep failure issue
    needs:
      - python-deferred
      - compatibility-sweep
      - dependency-minimum
      - fuzz-stress
      - deferred-success
    if: ${{ !cancelled() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fuzz reports
        # A job that failed before uploading leaves nothing to download; the
        # issue must still be opened (it then points at the run log).
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: fuzz-deferred-*
          path: fuzz-reports

      - name: Open or update the failure issue
        uses: actions/github-script@v8
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const reportFailure = require("./scripts/ci_failure_issue.js");
            await reportFailure({ github, context, core }, {
              title: "CI deferred: compatibility sweep failure",
              label: "ci-deferred",
              labelDescription: "Failure in the non-required ci-deferred.yml compatibility sweep",
              intro: [
                "The non-required deferred compatibility sweep (`.github/workflows/ci-deferred.yml`) failed.",
                "Fix the failing lane (or record an explicit, documented exclusion), then close this issue.",
                "Scale-3 fuzz failures list each failing seed with a replay command; add a minimized",
                "reproduction to the Suite 13 permanent corpus in the fix PR. Later failing runs comment",
                "here while this issue is open.",
              ].join("\n"),
              reportsDir: "fuzz-reports",
              reportName: "fuzz-failures.md",
              noReport: "No fuzz report artifact was found (no scale-3 fuzz failure, or it failed before uploading); see the run log.",
            });
